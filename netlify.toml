[build]
  publish = "."
  functions = "netlify/functions"

  [build.processing]
    ignore_html_forms = false

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/output/pdf/signallabs-partnership-method.pdf"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/internal-analytics-qs/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/.netlify/functions/analytics"
  [headers.values]
    Cache-Control = "no-store"

[[redirects]]
  from = "/work"
  to = "/#work"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/#contact"
  status = 301

[[redirects]]
  from = "/case-studies/:slug"
  to = "/case-studies/:slug/"
  status = 301
