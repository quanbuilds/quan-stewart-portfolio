<div class="site-navigation">
<header>
<div class="logo"><span aria-hidden="true" class="tideline-logo"></span><span class="logo-wordmark">TideLine</span></div>
</header>
<nav class="tabs" aria-label="Main navigation">
<a class="tab" href="/">Home</a>

<main id="main">
<section id="contact" aria-labelledby="contact-title">
<div class="contact-wrap">
<h1 id="contact-title">Contact TideLine</h1>
<form action="/api/contact" class="contact-form" id="contactForm" method="post">
<div class="form-row"><label for="contact-name">Name</label><input autocomplete="name" id="contact-name" maxlength="120" name="name" required=""/></div>
<div class="form-row"><label for="contact-business">Business</label><input autocomplete="organization" id="contact-business" maxlength="180" name="business" required=""/></div>
<div class="form-row"><label for="contact-email">Email</label><input autocomplete="email" id="contact-email" maxlength="180" name="email" required="" type="email"/></div>
<div class="form-row"><label for="contact-phone">Phone (optional)</label><input autocomplete="tel" id="contact-phone" maxlength="80" name="phone" type="tel"/></div>
<div class="form-row"><label for="contact-message">What work would you like to make easier?</label><textarea id="contact-message" maxlength="2000" name="message" required="" rows="5"></textarea></div>
<div aria-hidden="true" class="form-trap"><label for="contact-website">Website</label><input autocomplete="off" id="contact-website" name="website" tabindex="-1"/></div>
<p class="form-note">We use your details to respond to your message.</p>
<button class="cta-primary" type="submit">Request a conversation</button>
<p aria-live="polite" class="form-status" id="contactStatus" role="status"></p>
</form></div>
</section>
</main>
